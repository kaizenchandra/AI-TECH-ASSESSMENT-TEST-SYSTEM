limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 512k;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
 location ~ ^/api/v1/(login|register|verify)$ {
  limit_req zone=auth burst=10 nodelay;
  proxy_pass http://backend:8080;
  proxy_set_header Host $host;
 }
 location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; }
 location / { try_files $uri $uri/ /index.html; }
}
